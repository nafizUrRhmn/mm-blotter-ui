<div class="card h-100 hover-lift" [class.bg-body-tertiary]="variant() === 'accent'">
  <div class="card-body d-flex flex-column gap-3">
    <div class="d-flex align-items-center gap-3">
      @if (icon()) {
        <span class="icon-badge" [ngClass]="'text-bg-' + accent() + '-subtle text-' + accent() + '-emphasis'">
          <app-icon [name]="icon()!" size="18" />
        </span>
      }
      <span class="text-muted fw-medium small">{{ title() }}</span>
    </div>

    @if (value()) {
      <div class="d-flex align-items-baseline gap-3 flex-wrap">
        <span class="fs-3 fw-bold">{{ value() }}</span>
        @if (delta()) {
          <span
            class="badge rounded-pill fw-semibold"
            [class.text-bg-secondary-subtle]="deltaTone() === 'neutral'"
            [class.text-secondary-emphasis]="deltaTone() === 'neutral'"
            [class.text-bg-success-subtle]="deltaTone() === 'positive'"
            [class.text-success-emphasis]="deltaTone() === 'positive'"
            [class.text-bg-danger-subtle]="deltaTone() === 'negative'"
            [class.text-danger-emphasis]="deltaTone() === 'negative'"
          >
            {{ delta() }}
          </span>
        }
      </div>
    }

    @if (rows().length) {
      <div class="d-flex flex-column gap-2 border-top pt-3 mt-auto">
        @for (row of rows(); track row.label) {
          <div class="d-flex align-items-center justify-content-between gap-3 small">
            <span class="text-muted flex-shrink-1" style="min-width: 0;">{{ row.label }}</span>
            <span
              class="fw-semibold d-inline-flex align-items-center gap-2 flex-shrink-0 text-nowrap"
              [class.text-success]="row.tone === 'positive'"
              [class.text-danger]="row.tone === 'negative'"
            >
              {{ row.value }}
              @if (row.editable) {
                <button class="btn btn-link btn-sm p-0 text-muted" type="button" aria-label="Edit value">✎</button>
              }
            </span>
          </div>
        }
      </div>
    }

    <ng-content></ng-content>
  </div>
</div>
